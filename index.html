<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PachinKaki 🎰</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow:hidden;touch-action:none}
body{background:#060610;display:flex;flex-direction:column;align-items:center;
  height:100dvh;overflow:hidden;touch-action:none;user-select:none}
#c{display:block;touch-action:none;cursor:ns-resize;flex-shrink:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CANVAS & LAYOUT
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const CW = 420, CH = 710;
canvas.width = CW; canvas.height = CH;

function fitCanvas(){
  const scale = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  canvas.style.width  = Math.floor(CW * scale) + 'px';
  canvas.style.height = Math.floor(CH * scale) + 'px';
}
window.addEventListener('resize', fitCanvas, {passive:true});
fitCanvas();

// Play field
const FX=10, FY=68, FW=325, FH=548;
const FX2=FX+FW, FY2=FY+FH;   // 335, 616

// Peg zone (clear runway at top for ball arc)
const PX1=FX+20, PX2=FX2-20;
const PY1=FY+78, PY2=FY2-90;   // dense grid starts lower

const PEG_R=4, BUMP_R=7, BALL_R=6;
const VZX=FX+FW/2;   // 172.5

// Rail channel: right side (x = FX2+8 to CW-4)
const RAIL_X=FX2+8;    // 343
const RAIL_CX=RAIL_X+34; // 377 — ball launch x

// Dial track — vertical slider in rail panel
const DIAL_CX = RAIL_X + (CW-RAIL_X)/2;  // center of rail panel ≈ 381
const DIAL_TY = 185;   // top of track = MAX power
const DIAL_BY = 470;   // bottom of track = zero zone

// Pockets — wider OUTs, narrower V-zone for authentic house edge
// [1:32][3:32][OUT:52][5:30][V:26][5:30][OUT:52][3:32][1:32] = 318 → +7 each OUT=55 → 324 → close
// Final: [1:33][3:33][OUT:55][5:31][V:27][5:31][OUT:55][3:33][1:33] = 6×33+2×55+27=198+110+27=335 → use this
const PKT_H=80;
const PKT_TOP=FY2-PKT_H;   // 536
const PKT_DETECT=FY2-12;   // 604
const POCKETS=[
  {l:'1',  t:'score',b:1, p:100,  x1:FX,     x2:FX+33 },
  {l:'3',  t:'score',b:3, p:300,  x1:FX+33,  x2:FX+66 },
  {l:'OUT',t:'out',  b:0, p:0,    x1:FX+66,  x2:FX+121},  // 55px wide
  {l:'5',  t:'score',b:5, p:500,  x1:FX+121, x2:FX+152},
  {l:'V',  t:'vzone',b:3, p:1500, x1:FX+152, x2:FX+179},  // 27px — narrow jackpot!
  {l:'5',  t:'score',b:5, p:500,  x1:FX+179, x2:FX+210},
  {l:'OUT',t:'out',  b:0, p:0,    x1:FX+210, x2:FX+265},  // 55px wide
  {l:'3',  t:'score',b:3, p:300,  x1:FX+265, x2:FX+298},
  {l:'1',  t:'score',b:1, p:100,  x1:FX+298, x2:FX+331},
];

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
const G={
  balls:250, score:0,
  hi: parseInt(localStorage.getItem('pk_hi')||'0'),
  fever:false, feverT:0, totalFevers:0,
  dialPower:0,       // 0-1, STAYS where set (like a real knob)
  activeBalls:[],
  particles:[],
  pocketAssigned: new Map(),
  flashMsg:null,
  bonusPegCooldown: new Map(),
};

let fireInterval = null;
let dialDragging = false;

// ═══════════════════════════════════════════════════════════
// MATTER.JS
// ═══════════════════════════════════════════════════════════
const {Engine,Bodies,Body,Composite,Events,Runner}=Matter;
const engine=Engine.create({gravity:{x:0,y:1.8}});
const world=engine.world;
Matter.Runner.run(Matter.Runner.create(),engine);

const allPegs=[],redPegs=[],bluePegs=[];
let deflector;
const hitFlash=new Map();

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
let audioOk=false;
async function startAudio(){
  if(audioOk) return;
  await Tone.start();
  audioOk=true;
}

const plinkPoly=new Tone.PolySynth(Tone.Synth,{
  oscillator:{type:'triangle'},
  envelope:{attack:.001,decay:.055,sustain:0,release:.07},volume:-13
}).toDestination();

const coinSynth=new Tone.MetalSynth({
  frequency:700,envelope:{attack:.001,decay:.2,release:.08},
  harmonicity:5.1,volume:-11
}).toDestination();
const pockSynth=new Tone.Synth({
  oscillator:{type:'square'},
  envelope:{attack:.001,decay:.14,sustain:0,release:.15},volume:-12
}).toDestination();

const jinglPoly=new Tone.PolySynth(Tone.Synth,{
  oscillator:{type:'sine'},
  envelope:{attack:.02,decay:.25,sustain:.1,release:.3},volume:-8
}).toDestination();

let lastPlink=0;
function plink(vel){
  if(!audioOk) return;
  const now=Date.now(); if(now-lastPlink<30) return; lastPlink=now;
  const freq=Math.min(2200,450+Math.abs(vel)*90);
  try{plinkPoly.triggerAttackRelease(Tone.Frequency(freq,'hz').toNote(),'32n');}catch(e){}
}
function playPocket(pts){
  if(!audioOk) return;
  try{
    pockSynth.triggerAttackRelease(180+pts/6,'8n');
    coinSynth.triggerAttack(); setTimeout(()=>coinSynth.triggerRelease(),200);
  }catch(e){}
}
function playVzone(){
  if(!audioOk) return;
  ['C5','E5','G5','B5','C6'].forEach((n,i)=>jinglPoly.triggerAttackRelease(n,'8n',Tone.now()+i*.1));
}
function playFeverStart(){
  if(!audioOk) return;
  ['C4','E4','G4','C5','E5','G5','C6'].forEach((n,i)=>jinglPoly.triggerAttackRelease(n,'8n',Tone.now()+i*.09));
}
function playFeverEnd(){
  if(!audioOk) return;
  ['C6','A5','F5','D5','C5'].forEach((n,i)=>jinglPoly.triggerAttackRelease(n,'8n',Tone.now()+i*.12));
}
function playBonus(){ if(audioOk) try{jinglPoly.triggerAttackRelease('G5','8n');}catch(e){} }
function playLaunch(){
  if(!audioOk) return;
  try{
    const s=new Tone.Synth({oscillator:{type:'sawtooth'},
      envelope:{attack:.005,decay:.07,sustain:0,release:.1},volume:-16}).toDestination();
    s.triggerAttackRelease('C3','16n');
    setTimeout(()=>s.dispose(),400);
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
// BUILD WORLD
// ═══════════════════════════════════════════════════════════
function buildWorld(){
  const wOpt={isStatic:true,restitution:.3,friction:.2,label:'wall'};

  // Play field side walls — NO top wall (open top for ball entry)
  Composite.add(world,[
    Bodies.rectangle(FX-4,    FY+FH/2, 8, FH, wOpt),
    Bodies.rectangle(FX2+4,   FY+FH/2, 8, FH, wOpt),
  ]);

  // Rail left wall (separates play field from launch channel)
  Composite.add(world, Bodies.rectangle(FX2+4, FY+FH/2+20, 8, FH-40, {...wOpt,label:'rail'}));

  // Stopper at bottom of rail (catches zero-power shots)
  Composite.add(world, Bodies.rectangle(RAIL_CX, CH-8, 80, 8, {...wOpt,label:'rail',restitution:.05}));

  // Top-right curve — quarter-circle approximation redirecting ball leftward
  // Higher speed ball hits this and exits with proportionally higher leftward velocity
  Composite.add(world,[
    Bodies.rectangle(404,FY+14,55,7,{isStatic:true,angle:-0.70,restitution:.42,label:'guide'}),
    Bodies.rectangle(376,FY+40,42,7,{isStatic:true,angle:-0.38,restitution:.42,label:'guide'}),
    Bodies.rectangle(355,FY+64,30,7,{isStatic:true,angle:-0.14,restitution:.42,label:'guide'}),
  ]);

  // Pocket dividers
  [FX+33,FX+66,FX+121,FX+152,FX+179,FX+210,FX+265,FX+298].forEach(px=>{
    Composite.add(world,Bodies.rectangle(px,FY2-PKT_H/2,4,PKT_H+4,
      {isStatic:true,restitution:.1,friction:.9,label:'pwall'}));
  });
  Composite.add(world,[
    Bodies.rectangle(FX-1,  FY2-PKT_H/2,4,PKT_H,{isStatic:true,label:'pwall'}),
    Bodies.rectangle(FX2+1, FY2-PKT_H/2,4,PKT_H,{isStatic:true,label:'pwall'}),
  ]);

  // Spinning deflector wheel (mid-field — authentic in some machines)
  deflector=Bodies.rectangle(VZX-20,FY+220,68,9,
    {isStatic:true,restitution:.5,friction:.03,label:'deflector'});
  Composite.add(world,deflector);

  generatePegs();
}

function generatePegs(){
  const hGap=26, vGap=23;   // dense grid
  const cols=Math.floor((PX2-PX1)/hGap)+1;
  const rows=Math.floor((PY2-PY1)/vGap)+1;

  const redSet=new Set(), blueSet=new Set();
  while(redSet.size<7){
    const r=Math.floor(Math.random()*(rows-3))+3;
    const c=Math.floor(Math.random()*cols);
    redSet.add(`${r},${c}`);
  }
  while(blueSet.size<3){
    const r=Math.floor(Math.random()*(Math.floor(rows/2)-2))+2;
    const c=Math.floor(Math.random()*cols);
    const k=`${r},${c}`;
    if(!redSet.has(k)) blueSet.add(k);
  }

  for(let row=0;row<rows;row++){
    const off=(row%2===0)?0:hGap/2;
    const colsInRow=(row%2===0)?cols:cols-1;
    for(let col=0;col<colsInRow;col++){
      const x=PX1+off+col*hGap;
      const y=PY1+row*vGap;
      if(x>PX2||x<PX1) continue;
      if(Math.random()<0.09) continue;  // 9% skip

      const key=`${row},${col}`;
      const isRed=redSet.has(key), isBlue=blueSet.has(key);
      const r=isBlue?BUMP_R:PEG_R, rest=isBlue?0.92:0.5;

      const peg=Bodies.circle(x,y,r,{isStatic:true,
        label:isRed?'red-peg':isBlue?'blue-bumper':'peg',restitution:rest,friction:.05});
      allPegs.push(peg);
      if(isRed) redPegs.push(peg);
      if(isBlue) bluePegs.push(peg);
      Composite.add(world,peg);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// DIAL — continuous launcher (authentic pachinko knob)
// Ball fires every ~1s while dial > 5%.  Dial STAYS where set.
// ═══════════════════════════════════════════════════════════
function yToDial(canvasY){
  const dead=30; // zero zone at very bottom of track
  if(canvasY >= DIAL_BY - dead) return 0;
  const norm = 1 - (canvasY - DIAL_TY) / ((DIAL_BY-dead) - DIAL_TY);
  return Math.max(0, Math.min(1, norm));
}

function setDial(p){
  G.dialPower = Math.max(0, Math.min(1, p));
  if(G.dialPower > 0.04){
    if(!fireInterval){
      // Immediate first launch, then continuous
      launchBall();
      fireInterval = setInterval(()=>{
        if(G.balls>0 && G.dialPower>0.04) launchBall();
        else if(G.balls<=0){ clearInterval(fireInterval); fireInterval=null; }
      }, 920);
    }
  } else {
    G.dialPower=0;
    if(fireInterval){ clearInterval(fireInterval); fireInterval=null; }
  }
}

// ═══════════════════════════════════════════════════════════
// LAUNCH — ball appears at top of field; power sets entry position (left↔right)
// Physics root cause: gravity=1.8, travel height=580px → needs vy>45 to reach top,
// but old code only gave vy≤34. Ball stalled and fell back every time.
// ═══════════════════════════════════════════════════════════
function launchBall(){
  if(G.balls<=0) return;

  const p = G.dialPower + (Math.random()-.5)*0.08;
  const cp = Math.max(0, Math.min(1.0, p));

  // Below 15% power: not enough to reach field, refund
  if(cp < 0.15){ playLaunch(); return; }

  G.balls--;

  // Map power 0.15→1.0 to field entry x: right side → left side
  // LOW  (15-40%)  → right quarter  (enters near right wall, long peg path)
  // MED  (40-70%)  → center-right to center
  // HIGH (70-90%)  → center to left
  // MAX  (90-100%) → hard left (hits left wall, unpredictable — overshoot penalty)
  const t = (cp - 0.15) / 0.85;  // 0=min, 1=max
  const fieldL = FX + BALL_R + 4;
  const fieldR = FX2 - BALL_R - 4;
  const entryX = fieldR - t * (fieldR - fieldL) + (Math.random()-0.5) * 12;
  const entryY = FY + BALL_R + 4;

  const ball = Bodies.circle(entryX, entryY, BALL_R,
    {label:'ball', restitution:.42, friction:.05, frictionAir:.004, density:.0025});
  ball._born = Date.now();
  ball._enteredField = true;
  Body.setVelocity(ball, {x:(Math.random()-0.5)*1.5, y:1.5+Math.random()*0.5});
  Composite.add(world, ball);
  G.activeBalls.push(ball);
  playLaunch();
}

// ═══════════════════════════════════════════════════════════
// COLLISIONS
// ═══════════════════════════════════════════════════════════
Events.on(engine,'collisionStart',event=>{
  for(const {bodyA,bodyB} of event.pairs){
    let ball=null, other=null;
    if(bodyA.label==='ball'){ball=bodyA;other=bodyB;}
    else if(bodyB.label==='ball'){ball=bodyB;other=bodyA;}
    if(!ball) continue;
    const vel=Math.sqrt(ball.velocity.x**2+ball.velocity.y**2);

    if(['peg','guide','deflector','pwall','rail'].includes(other.label)){
      plink(vel); hitFlash.set(other,Date.now());
    }
    if(other.label==='red-peg'){
      const cd=G.bonusPegCooldown.get(other.id)||0;
      if(Date.now()-cd>1500){
        G.bonusPegCooldown.set(other.id,Date.now());
        G.balls+=5; playBonus();
        hitFlash.set(other,Date.now());
        spark(other.position.x,other.position.y,'#ff4040',10);
        flash('+5 BALLS!','#ff6060');
        Body.applyForce(ball,ball.position,{x:(Math.random()-.5)*.003,y:-.002});
      }
    }
    if(other.label==='blue-bumper'){
      plink(vel*2); hitFlash.set(other,Date.now());
      spark(other.position.x,other.position.y,'#40a0ff',7);
      const dx=ball.position.x-other.position.x;
      const dy=ball.position.y-other.position.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      Body.applyForce(ball,ball.position,{x:dx/d*.006,y:dy/d*.006});
    }
  }
});

// ═══════════════════════════════════════════════════════════
// POCKET AWARD
// ═══════════════════════════════════════════════════════════
function getPocket(x){ return POCKETS.find(p=>x>=p.x1&&x<p.x2)||null; }

function awardPocket(pkt,ball){
  let ballPay=pkt.b, ptsPay=pkt.p;
  if(G.fever){ ballPay=pkt.t==='vzone'?15:ballPay*2; ptsPay*=5; }
  if(pkt.t==='vzone'){
    if(G.fever){ G.feverT=Math.min(G.feverT+20,45); flash('CHAIN +20s!','#ffd700'); }
    else{ G.fever=true; G.feverT=20; G.totalFevers++; playFeverStart(); flash('🔥 FEVER! 大当たり!','#ffd700'); }
    G.balls+=ballPay; G.score+=ptsPay;
    playVzone(); spark(ball.position.x,ball.position.y,'#ffd700',20);
  } else if(pkt.t==='score'){
    G.balls+=ballPay; G.score+=ptsPay;
    playPocket(ptsPay); spark(ball.position.x,ball.position.y,'#40ff80',7);
    flash(`+${ballPay} balls!`,'#40ff80');
  } else { playPocket(0); flash('OUT','#ff4040'); }
  if(G.score>G.hi){G.hi=G.score;localStorage.setItem('pk_hi',G.hi);}
}

// ═══════════════════════════════════════════════════════════
// PARTICLES & FLASH
// ═══════════════════════════════════════════════════════════
function spark(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2/n)*i+Math.random()*.8, spd=1.5+Math.random()*3;
    G.particles.push({x,y,color,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,sz:2+Math.random()*2});
  }
}
function flash(text,color){ G.flashMsg={text,color,t:90}; }

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
let lastT=0;
function update(ts){
  const dt=Math.min(ts-lastT,50); lastT=ts;
  const now=Date.now();

  if(G.fever){ G.feverT-=dt/1000; if(G.feverT<=0){G.fever=false;G.feverT=0;playFeverEnd();} }

  Body.setAngle(deflector, deflector.angle+.013);

  // Ball lifecycle
  const remove=[];
  for(const b of G.activeBalls){
    const {x,y}=b.position;
    // All balls spawn inside the field with _enteredField=true; this is a safety fallback
    if(!b._enteredField && x<FX2-BALL_R && y>FY+40 && y<FY2-PKT_H) b._enteredField=true;
    // Pocket detection
    if(b._enteredField && !G.pocketAssigned.has(b) && y>PKT_DETECT && b.velocity.y>0)
      G.pocketAssigned.set(b,getPocket(x));
    // Remove conditions (y>FY2+30 only after entering field — rail balls spawn below FY2)
    if((b._enteredField&&y>FY2+30) || now-b._born>16000 || (b._enteredField&&(x<FX-30||x>FX2+30)))
      remove.push(b);
  }
  for(const b of remove){
    if(b._enteredField){
      const pkt=G.pocketAssigned.get(b)||getPocket(b.position.x);
      if(pkt&&b.position.y>PKT_TOP) awardPocket(pkt,b);
    }
    Composite.remove(world,b);
    G.activeBalls=G.activeBalls.filter(z=>z!==b);
    G.pocketAssigned.delete(b);
  }

  G.particles=G.particles.filter(p=>p.life>0);
  for(const p of G.particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.vx*=.93; p.life-=.035; }
  if(G.flashMsg) G.flashMsg.t--;
  if(G.flashMsg?.t<=0) G.flashMsg=null;
}

// ═══════════════════════════════════════════════════════════
// GENERATED IMAGES (Nano Banana / Imagen 4)
// ═══════════════════════════════════════════════════════════
const IMG = {};
function loadImg(key, src){
  const img = new Image();
  img.onload = () => { IMG[key] = img; };
  img.onerror = () => {};  // graceful fallback if file missing
  img.src = src;
}
loadImg('frame', 'frame.png');
loadImg('bg',    'bg.png');
loadImg('fever', 'fever.png');

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function render(ts){
  const now=Date.now();
  ctx.fillStyle='#060610'; ctx.fillRect(0,0,CW,CH);

  // Machine frame image (Imagen 4 generated)
  if(IMG.frame){
    ctx.globalAlpha=0.85;
    ctx.drawImage(IMG.frame,0,0,CW,CH);
    ctx.globalAlpha=1;
  }

  // Outer neon border (fever = cycling hue) — drawn over frame
  const fc=G.fever?`hsl(${(now*.1)%360},100%,60%)`:'#ff00cc';
  ctx.shadowColor=fc; ctx.shadowBlur=16; ctx.strokeStyle=fc; ctx.lineWidth=4;
  rr(2,2,CW-4,CH-4,8); ctx.stroke(); ctx.shadowBlur=0;
  [[10,10],[CW-10,10],[10,CH-10],[CW-10,CH-10]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2);
    ctx.fillStyle='#00ccff'; ctx.shadowColor='#00ccff'; ctx.shadowBlur=10;
    ctx.fill(); ctx.shadowBlur=0;
  });

  drawScoreUI(now);

  // Field background — generated background image or solid fallback
  if(IMG.bg){
    ctx.save();
    ctx.globalAlpha=0.55;
    ctx.drawImage(IMG.bg,FX,FY,FW,FH);
    ctx.globalAlpha=0.7;
    ctx.fillStyle='#0a0a20';
    ctx.fillRect(FX,FY,FW,FH);
    ctx.restore();
  } else {
    ctx.fillStyle='#0c0c22'; ctx.fillRect(FX,FY,FW,FH);
  }
  ctx.strokeStyle='#00ccff'; ctx.lineWidth=1.5; ctx.shadowColor='#00ccff'; ctx.shadowBlur=8;
  ctx.strokeRect(FX,FY,FW,FH); ctx.shadowBlur=0;

  // Top runway hint
  ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillStyle='#252548';
  ctx.fillText('← HIGH power ·  LOW power →', FX+FW/2, FY+15);

  drawRailPanel(now);
  drawPegs(now);
  drawDeflector();
  drawPockets(now);

  // Pocket divider lines
  [FX+33,FX+66,FX+121,FX+152,FX+179,FX+210,FX+265,FX+298].forEach(px=>{
    ctx.fillStyle='#1a1a30'; ctx.fillRect(px-1,PKT_TOP,3,PKT_H);
  });

  drawBalls();

  for(const p of G.particles){
    ctx.globalAlpha=p.life*.9; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  if(G.flashMsg){
    const a=Math.min(1,G.flashMsg.t/20);
    ctx.globalAlpha=a; ctx.font='bold 20px monospace'; ctx.textAlign='center';
    ctx.fillStyle=G.flashMsg.color; ctx.shadowColor=G.flashMsg.color; ctx.shadowBlur=14;
    ctx.fillText(G.flashMsg.text,FX+FW/2,FY+FH/2-10);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(G.fever){
    // Fever celebration image (Imagen 4 generated) as dramatic background flash
    if(IMG.fever){
      const pulse=(Math.sin(now*.008)*.5+.5);
      ctx.globalAlpha=pulse*0.32;
      ctx.drawImage(IMG.fever,FX,FY,FW,FH);
      ctx.globalAlpha=1;
    }
    const pa=(Math.sin(now*.007)*.5+.5)*.12;
    ctx.fillStyle=`rgba(255,215,0,${pa})`; ctx.fillRect(FX,FY,FW,FH);
    ctx.textAlign='center'; ctx.font='bold 16px monospace';
    ctx.fillStyle='#ffd700'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=16;
    ctx.fillText(`🔥 FEVER! ${Math.ceil(G.feverT)}s`,FX+FW/2,FY+40);
    ctx.fillText('×5 MULTIPLIER',FX+FW/2,FY+58);
    ctx.shadowBlur=0;
  }

  drawDialPanel(now);
  drawTray();
  ctx.textAlign='left';
}

function drawScoreUI(now){
  ctx.fillStyle='#08081a'; ctx.fillRect(0,0,CW,FY);
  ctx.font='10px monospace'; ctx.textAlign='left';
  ctx.fillStyle='#505060'; ctx.fillText('HI',12,16);
  ctx.font='12px monospace'; ctx.fillStyle='#ff7070';
  ctx.fillText(String(G.hi).padStart(8,'0'),26,16);
  ctx.font='bold 27px "Courier New",monospace'; ctx.textAlign='center';
  ctx.shadowColor='#ff1a1a'; ctx.shadowBlur=20; ctx.fillStyle='#ff3c3c';
  ctx.fillText(String(G.score).padStart(8,'0'),FX+FW/2,50); ctx.shadowBlur=0;
  ctx.font='bold 15px monospace'; ctx.textAlign='right';
  ctx.fillStyle='#40ffff'; ctx.shadowColor='#40ffff'; ctx.shadowBlur=8;
  ctx.fillText(`⦿ ${G.balls}`,CW-6,26); ctx.shadowBlur=0;
  ctx.font='10px monospace'; ctx.fillStyle='#404058';
  ctx.fillText(`${G.activeBalls.length} in play`,CW-6,42);
}

function drawRailPanel(now){
  ctx.fillStyle='#09090f'; ctx.fillRect(RAIL_X,FY,CW-RAIL_X,FY2-FY);
  ctx.strokeStyle='#1a1a32'; ctx.lineWidth=1;
  ctx.strokeRect(RAIL_X+1,FY+1,CW-RAIL_X-3,FY2-FY-2);

  // Dashed trajectory guide
  ctx.strokeStyle='rgba(80,60,180,0.16)'; ctx.lineWidth=1.5;
  ctx.setLineDash([5,12]);
  ctx.beginPath();
  ctx.moveTo(RAIL_CX,FY2-100);
  ctx.lineTo(RAIL_CX,FY+66);
  ctx.quadraticCurveTo(RAIL_CX,FY+18,FX2-18,FY+35);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPegs(now){
  for(const peg of allPegs){
    const {x,y}=peg.position;
    const isRed=peg.label==='red-peg', isBlue=peg.label==='blue-bumper';
    const r=isBlue?BUMP_R:PEG_R;
    const hitAge=now-(hitFlash.get(peg)||0), flashing=hitAge<120;

    ctx.save();
    let gc,hc;
    if(isRed){gc='#ff2020';hc='#ff8080';}
    else if(isBlue){gc='#2050ff';hc='#80c0ff';}
    else{gc='#c8a84e';hc='#e8c870';}

    const pulse=Math.sin(now*.006+x)*.35+.65;
    ctx.shadowColor=gc; ctx.shadowBlur=flashing?18:(isRed||isBlue?8:3)*pulse;

    const grad=ctx.createRadialGradient(x-r*.3,y-r*.35,0,x,y,r*1.1);
    grad.addColorStop(0,flashing?'#fff':hc);
    grad.addColorStop(1,flashing?hc:gc);

    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.arc(x-r*.28,y-r*.32,r*.28,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${flashing?.6:.28})`; ctx.fill();
    if(isRed){ ctx.shadowBlur=0; ctx.font='bold 6px monospace'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('+5',x,y+2); }
    ctx.restore();
  }
  ctx.textAlign='left';
}

function drawDeflector(){
  ctx.save();
  ctx.translate(deflector.position.x,deflector.position.y); ctx.rotate(deflector.angle);
  ctx.shadowColor='#00ccff'; ctx.shadowBlur=10;
  const g=ctx.createLinearGradient(-34,-4,34,4);
  g.addColorStop(0,'#003355'); g.addColorStop(.5,'#0088bb'); g.addColorStop(1,'#003355');
  ctx.fillStyle=g; rr(-34,-4,68,9,4); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

function drawPockets(now){
  POCKETS.forEach(pk=>{
    const pw=pk.x2-pk.x1, px=pk.x1, py=PKT_TOP;
    const mid=(pk.x1+pk.x2)/2;
    let bg;
    if(pk.t==='vzone'){
      const pp=Math.sin(now*.005)*.4+.6;
      bg=G.fever?`rgba(255,215,0,${pp*.7})`:`rgba(100,70,0,${pp*.8})`;
    } else if(pk.t==='out'){ bg='rgba(60,8,8,.85)'; }
    else{ bg='rgba(8,35,18,.85)'; }
    ctx.fillStyle=bg; ctx.fillRect(px+2,py,pw-2,PKT_H);
    ctx.textAlign='center';
    if(pk.t==='vzone'){
      ctx.font='bold 7px monospace'; ctx.fillStyle=G.fever?'#fff':'#ffd700';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=G.fever?14:6;
      ctx.fillText('V-ZONE',mid,py+13);
      ctx.font='bold 10px monospace'; ctx.fillText('大当',mid,py+26);
      ctx.font='8px monospace'; ctx.fillText('+15',mid,py+38); ctx.shadowBlur=0;
    } else {
      ctx.font=`bold ${pk.t==='out'?8:11}px monospace`;
      ctx.fillStyle=pk.t==='out'?'#ff5050':'#60ffa0';
      ctx.fillText(pk.l,mid,py+18);
      if(pk.t==='score'){ ctx.font='8px monospace'; ctx.fillStyle='rgba(80,200,100,.7)'; ctx.fillText(`+${pk.b}b`,mid,py+30); }
    }
  });
  ctx.textAlign='left';
}

function drawBalls(){
  for(const b of G.activeBalls){
    const {x,y}=b.position;
    if(y<FY-BALL_R*2) continue;
    const grad=ctx.createRadialGradient(x-BALL_R*.32,y-BALL_R*.38,.5,x+BALL_R*.1,y+BALL_R*.1,BALL_R*1.1);
    grad.addColorStop(0,'#ffffff'); grad.addColorStop(.18,'#e0e0f0');
    grad.addColorStop(.6,'#8888a8'); grad.addColorStop(1,'#282838');
    ctx.beginPath(); ctx.arc(x,y,BALL_R,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=.5; ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
// DIAL PANEL — vertical lever, stays where set
// ═══════════════════════════════════════════════════════════
function drawDialPanel(now){
  // Background
  ctx.fillStyle='#09090f'; ctx.fillRect(RAIL_X,FY2,CW-RAIL_X,CH-FY2);

  // Ball entry point (launch socket at bottom of rail)
  ctx.beginPath(); ctx.arc(RAIL_CX,CH-22,11,0,Math.PI*2);
  ctx.fillStyle='rgba(50,35,100,.9)'; ctx.fill();
  ctx.strokeStyle='#5040a0'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(100,80,200,.55)';
  ctx.beginPath(); ctx.moveTo(RAIL_CX,CH-40); ctx.lineTo(RAIL_CX-7,CH-30); ctx.lineTo(RAIL_CX+7,CH-30); ctx.fill();

  const trackX=DIAL_CX, ty=DIAL_TY, by=DIAL_BY;
  const thumbY = ty + (1-G.dialPower)*(by-ty);
  const firing = G.dialPower > 0.04 && fireInterval !== null;

  // Track background
  ctx.fillStyle='#0e0e1e'; ctx.fillRect(trackX-5,ty,10,by-ty);
  ctx.strokeStyle='#252545'; ctx.lineWidth=1; ctx.strokeRect(trackX-5,ty,10,by-ty);

  // Track fill (bottom of thumb down = dead zone indicator)
  if(G.dialPower>0.04){
    const fillH=(by-ty)*G.dialPower;
    const r=Math.round(G.dialPower<.5?G.dialPower*2*60:60+G.dialPower*140);
    const g=Math.round(G.dialPower<.5?200:200*(1-G.dialPower));
    ctx.fillStyle=`rgb(${r},${g},0)`;
    ctx.shadowColor=`rgb(${r},${g},0)`;
    ctx.shadowBlur=G.dialPower>0.75?10:4;
    ctx.fillRect(trackX-3,by-fillH,6,fillH);
    ctx.shadowBlur=0;
  }

  // Zero zone indicator
  ctx.fillStyle='rgba(40,10,10,.8)'; ctx.fillRect(trackX-5,by-28,10,28);
  ctx.font='7px monospace'; ctx.textAlign='center'; ctx.fillStyle='#502020';
  ctx.fillText('OFF',trackX,by-10);

  // Thumb knob — large for easy grabbing
  const thumbR=20;
  const thumbColor=firing?`hsl(${(now*.3)%360},90%,55%)`:'#c8a060';
  ctx.beginPath(); ctx.arc(trackX,thumbY,thumbR,0,Math.PI*2);
  ctx.fillStyle=thumbColor; ctx.shadowColor=thumbColor; ctx.shadowBlur=firing?20:10;
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2; ctx.stroke();
  // Grip lines on thumb
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(trackX-9,thumbY); ctx.lineTo(trackX+9,thumbY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trackX-8,thumbY-5); ctx.lineTo(trackX+8,thumbY-5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trackX-8,thumbY+5); ctx.lineTo(trackX+8,thumbY+5); ctx.stroke();
  // Up/down arrows on thumb when idle
  if(G.dialPower<=0.04){
    ctx.fillStyle='rgba(255,240,100,0.9)'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText('↑↓',trackX,thumbY+4);
  }
  ctx.shadowBlur=0;

  // Tick marks & labels
  const ticks=[{p:1,l:'MAX'},{p:.75,l:'75%'},{p:.5,l:'MED'},{p:.25,l:'25%'},{p:0,l:'OFF'}];
  ticks.forEach(t=>{
    const tickY=ty+t.p*(by-ty);  // note: HIGH=ty, LOW=by → invert
    const actualY = ty + (1-t.p)*(by-ty);
    ctx.fillStyle='#304060'; ctx.fillRect(trackX+7,actualY-.5,8,1);
    ctx.font='8px monospace'; ctx.textAlign='left';
    ctx.fillStyle=t.p>0?'#405060':'#402020';
    ctx.fillText(t.l,trackX+17,actualY+3);
  });

  // Power readout
  ctx.textAlign='center';
  ctx.font='bold 12px monospace';
  ctx.fillStyle=G.dialPower>0.75?'#ff8040':G.dialPower>0.04?'#60cc60':'#606080';
  ctx.fillText(`${Math.round(G.dialPower*100)}%`,trackX,ty-8);

  // Launch instruction header — bright and prominent
  const idleP = G.dialPower<=0.04 ? Math.sin(Date.now()*.004)*.4+.6 : 1;
  ctx.font='bold 10px monospace';
  ctx.fillStyle=G.dialPower<=0.04?`rgba(255,220,60,${idleP})`:'#a08040';
  ctx.fillText('DRAG ↕',trackX,ty-28);
  ctx.font='9px monospace';
  ctx.fillStyle=G.dialPower<=0.04?`rgba(255,200,80,${idleP*.8})`:'#706030';
  ctx.fillText('TO LAUNCH',trackX,ty-16);

  // Firing indicator / status
  if(firing){
    const pulse=Math.sin(Date.now()*.008)*.5+.5;
    ctx.fillStyle=`rgba(100,255,100,${0.7+pulse*.3})`;
    ctx.font='bold 11px monospace';
    ctx.shadowColor='#60ff60'; ctx.shadowBlur=10;
    ctx.fillText('● FIRING!',trackX,by+18);
    ctx.shadowBlur=0;
  } else if(G.dialPower<=0.04){
    const p=Math.sin(Date.now()*.004)*.4+.6;
    ctx.fillStyle=`rgba(255,220,60,${p})`;
    ctx.font='bold 10px monospace';
    ctx.fillText('↑ DRAG UP',trackX,by+18);
    ctx.font='9px monospace'; ctx.fillStyle=`rgba(200,180,60,${p*.8})`;
    ctx.fillText('to fire balls',trackX,by+30);
  } else {
    ctx.fillStyle='#a0a040'; ctx.font='bold 9px monospace';
    ctx.fillText('↑ MORE  ↓ LESS',trackX,by+18);
    ctx.fillStyle='#606040'; ctx.font='8px monospace';
    ctx.fillText('release = stop',trackX,by+30);
  }

  ctx.fillStyle='#303040'; ctx.font='8px monospace';
  ctx.fillText('[S]=simulate',trackX,by+44);
}

function drawTray(){
  const ty=FY2+3;
  ctx.fillStyle='#08081a'; ctx.fillRect(FX,ty,FW,CH-ty-3);
  ctx.strokeStyle='#202038'; ctx.lineWidth=1; ctx.strokeRect(FX,ty,FW,CH-ty-3);
  ctx.textAlign='center';
  ctx.font='bold 20px monospace'; ctx.fillStyle='#40ffff'; ctx.shadowColor='#40ffff'; ctx.shadowBlur=12;
  ctx.fillText(`BALLS: ${G.balls}`,FX+FW/2,ty+30); ctx.shadowBlur=0;
  const maxPip=Math.min(G.activeBalls.length,18);
  for(let i=0;i<maxPip;i++){
    ctx.beginPath(); ctx.arc(FX+16+i*16,ty+54,5,0,Math.PI*2);
    const g=ctx.createRadialGradient(FX+14+i*16,ty+52,1,FX+16+i*16,ty+54,5);
    g.addColorStop(0,'#fff'); g.addColorStop(1,'#808090');
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.fillStyle='#282840'; ctx.font='9px monospace';
  ctx.fillText('TOTAL FEVERS: '+G.totalFevers,FX+FW/2,ty+72);
  ctx.textAlign='left';
}

// ═══════════════════════════════════════════════════════════
// INPUT — drag the dial (stays where left!)
// ═══════════════════════════════════════════════════════════
function inDialZone(x){ return x>=CW*0.80; }
function getCanvasXY(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*CW/r.width,(e.clientY-r.top)*CH/r.height];
}

canvas.addEventListener('pointerdown',async e=>{
  e.preventDefault();
  await startAudio();
  const [cx,cy]=getCanvasXY(e);
  if(inDialZone(cx)){ dialDragging=true; setDial(yToDial(cy)); }
},{passive:false});

canvas.addEventListener('pointermove',e=>{
  if(!dialDragging) return;
  const [cx,cy]=getCanvasXY(e);
  setDial(yToDial(cy));
});

canvas.addEventListener('pointerup',e=>{
  dialDragging=false;
  // Dial stays at current position — do NOT reset to 0
});

canvas.addEventListener('pointerleave',e=>{ dialDragging=false; });

// Scroll wheel: fine-tune dial ±5%
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  setDial(G.dialPower+(e.deltaY<0?0.05:-0.05));
},{passive:false});

canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart', e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchmove',  e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchend',   e=>e.preventDefault(),{passive:false});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.code==='ArrowUp'){e.preventDefault();setDial(G.dialPower+0.05);}
  if(e.code==='ArrowDown'){e.preventDefault();setDial(G.dialPower-0.05);}
  if(e.code==='Space'){e.preventDefault(); // toggle 50% / off
    startAudio();
    setDial(G.dialPower>0.04?0:0.50);
  }
  if(e.code==='KeyS') simulateGames(50);
  if(e.code==='Digit0'||e.code==='KeyQ') setDial(0);
});

// ═══════════════════════════════════════════════════════════
// 50-GAME SIMULATION (Press S) — probabilistic fast model
// ═══════════════════════════════════════════════════════════
function simulateGames(rounds=50){
  console.log(`\nRunning ${rounds}-game simulation...`);
  const results=[];

  for(let r=0;r<rounds;r++){
    let balls=250,score=0,fevers=0,launched=0;
    let feverActive=false,feverT=0;
    const pkt={out:0};
    POCKETS.forEach(p=>{if(p.t!=='out') pkt[p.l]=pkt[p.l]||0;});
    pkt['vzone']=0;

    while(balls>0&&launched<200){
      balls--;launched++;
      // Simulate range of powers (0.2-0.9)
      const power=0.2+Math.random()*0.7;

      // Entry x: high power → left, low power → right
      // Mechanical variation ±5% in power → spread entry
      const entryX=FX2-power*FW*0.90+(Math.random()-.5)*42;
      let x=Math.max(FX+4,Math.min(FX2-4,entryX));

      // Random walk through ~20 dense peg rows
      // Walls absorb rather than reflect (creates OUT zone bias)
      for(let i=0;i<20;i++){
        x+=(Math.random()-.5)*22;
        // Soft wall: absorbed rather than reflected → balls stay near where they entered
        if(x<FX+8)  x=FX+8+(FX+8-x)*0.15;
        if(x>FX2-8) x=FX2-8-(x-(FX2-8))*0.15;
      }

      // Red peg bonus: ~3.5% chance
      if(Math.random()<0.035){balls+=5;score+=50;}

      const pocket=POCKETS.find(p=>x>=p.x1&&x<p.x2);
      if(!pocket){pkt['out']++;continue;}

      const mult=feverActive?5:1;
      if(pocket.t==='vzone'){
        if(feverActive){feverT=Math.min(feverT+20,45);}
        else{feverActive=true;feverT=20;fevers++;}
        balls+=feverActive?15:3;score+=1500*mult;pkt['vzone']=(pkt['vzone']||0)+1;
      } else if(pocket.t==='score'){
        let b=pocket.b;if(feverActive)b*=2;
        balls+=b;score+=pocket.p*mult;pkt[pocket.l]=(pkt[pocket.l]||0)+1;
      } else {pkt['out']=(pkt['out']||0)+1;}
      if(feverActive){feverT-=3;if(feverT<=0){feverActive=false;feverT=0;}}
    }
    results.push({balls,score,fevers,launched,pkt});
  }

  const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const totalL=results.reduce((s,r)=>s+r.launched,0);
  const agg={};
  for(const r of results) for(const[k,v] of Object.entries(r.pkt)) agg[k]=(agg[k]||0)+v;

  console.log(`\n${'═'.repeat(52)}`);
  console.log(`  SIMULATION: ${rounds} games · max 200 balls/game`);
  console.log(`${'═'.repeat(52)}`);
  console.log(`Avg balls remaining  : ${avg(results.map(r=>r.balls)).toFixed(1)} / 250`);
  console.log(`Avg score            : ${avg(results.map(r=>r.score)).toFixed(0)}`);
  console.log(`Avg fevers/game      : ${avg(results.map(r=>r.fevers)).toFixed(2)}`);
  console.log(`Profitable (>250 b)  : ${results.filter(r=>r.balls>250).length} / ${rounds}`);
  console.log(`Bankrupt (0 balls)   : ${results.filter(r=>r.balls<=0).length} / ${rounds}`);
  console.log(`Total balls launched : ${totalL}`);
  console.log(`\nPocket distribution (${totalL} total):`);
  for(const k of['1','3','5','vzone','out']){
    const v=agg[k]||0;
    const pct=(v/totalL*100).toFixed(1);
    const bar='█'.repeat(Math.round(v/totalL*30));
    console.log(`  ${String(k).padEnd(7)} ${String(v).padStart(5)} (${String(pct).padStart(5)}%)  ${bar}`);
  }
  const he=(100-avg(results.map(r=>r.balls))/250*100).toFixed(1);
  console.log(`\nHouse edge           : ${he}% drain per 200-ball session`);
  console.log(`${'═'.repeat(52)}\n`);
  return results;
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════
let lastTAnim=0;
function loop(ts){
  update(ts);
  render(ts);
  requestAnimationFrame(loop);
}

buildWorld();
requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
